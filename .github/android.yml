name: Saving360 Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Grant Execute Permission to gradlew
      run: chmod +x ./gradlew

    - name:  Build App
      run: ./gradlew build

    - name:  Run Lint
      run: ./gradlew lint

    - name:  Run Unit Tests (if present)
      run: ./gradlew testDebugUnitTest
